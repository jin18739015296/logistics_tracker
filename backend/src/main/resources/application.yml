# 服务器配置
server:
  port: 8082
  servlet:
    context-path: /api
  address: 0.0.0.0  

# 数据库配置
spring:
  datasource:
    url: jdbc:mysql://localhost:13306/logistics_db?useSSL=false&serverTimezone=UTC
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  # Redis配置
  data:
    redis:
      enabled: true
      host: localhost
      port: 16379
      database: 0
      password:
      timeout: 60000
      lettuce:
        pool:
          max-active: 8
          max-wait: -1
          max-idle: 8
          min-idle: 0

  
  # RabbitMQ配置
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: admin
    virtual-host: /
    # 连接超时设置
    connection-timeout: 15000
    # 消息确认机制
    publisher-confirm-type: correlated
    publisher-returns: true
    # 模板配置
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000
        max-attempts: 3
        max-interval: 10000
        multiplier: 1.0
    # 监听器配置
    listener:
      simple:
        # 并发消费者数
        concurrency: 5
        max-concurrency: 10
        # 每次投递1个消息，消费完再投递
        prefetch: 1
        # 自动确认模式
        acknowledge-mode: auto
        # 失败重试
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 2.0
          stateless: true
        # 默认不重新入队（失败进入死信队列或丢弃）
        default-requeue-rejected: false
    # 勿设为 true：会与 OrderPaidConsumer 争抢 payment_success_queue（载荷格式不同）
    legacy-payment-consumer-enabled: false

    # 自定义队列配置
    queues:
      track: track_queue                    # 轨迹上传队列
      payment-success: payment_success_queue # 支付成功队列
      order-dispatch: order_dispatch_queue   # 订单分配队列
      logistics-event: logistics_event_queue # 物流事件队列

# MyBatis配置
mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.logistics.api.model
  configuration:
    map-underscore-to-camel-case: true
    default-executor-type: simple
    # 关闭SQL日志输出（如需调试可改为：org.apache.ibatis.logging.stdout.StdOutImpl）
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl



# JWT配置
# 密钥需要至少32个字符（256位），用于HS256算法
jwt:
  # 访问令牌配置
  access:
    secret: uVP4D+GVWkh0fNwYNBxLZzIEmD2km+H6RkdyfelOAVg=
    expiration: 3600000  # 1小时

  # 刷新令牌配置
  refresh:
    secret: rBXHBz8zy4I9/SYwALIhMnvHbzJnaVafbj+dqcI34gY=
    expiration: 604800000  # 7天

  # 令牌元数据
  issuer: logistics-platform
  audience: logistics-platform-api
  algorithm: HS256

# 文件上传配置
file:
  upload:
    path: uploads/              # 本地存储路径（OSS未启用时使用）
  access:
    url: /api/uploads/          # 本地文件访问URL前缀

# 调度算法配置
dispatch:
  rules:
    max-orders-per-courier: 5    # 单个配送员最大同时接单数
    search-radius-km: 10         # 初始搜索半径(公里)
    expand-radius-km: 20         # 扩展搜索半径(公里)
    auto-expand: true            # 是否自动扩大搜索范围
    # 自动派单评分（越小越好）：route·顺路额外里程 + direct·到本单寄件点距离 + load·在送单数
    route-penalty-weight: 10     # 顺路性权重（建议最大）
    direct-distance-weight: 1
    load-penalty-km-per-order: 1.5
    max-candidates-for-detour-scoring: 32  # 0=全员精算；先按距新单寄件点取前K人再算顺路与综合分

# 订单自动进入异常（约每 5 分钟扫描一次，演示环境可调大分钟数或 enabled: false）
app:
  order:
    auto-exception:
      enabled: true
      paid-not-in-pool-minutes: 45
      grab-pool-stale-minutes: 120
      awaiting-courier-confirm-minutes: 60
  # 测试环境配置：true-跳过部分校验（如确认送达距离校验），false-正常校验
  test-mode: true

# 阿里云 OSS 配置
aliyun:
  oss:
    enabled: true               # 是否启用OSS，true-使用OSS，false-使用本地存储
    endpoint: oss-cn-beijing.aliyuncs.com  # OSS Endpoint
    bucket-name: wubysj           # Bucket名称
    access-key-id: YOUR_ACCESS_KEY_ID       # AccessKey ID (请在环境变量中配置)
    access-key-secret: YOUR_ACCESS_KEY_SECRET  # AccessKey Secret (请在环境变量中配置)

